# Runs against each successful Vercel preview deployment (docs/15 §4): Playwright smoke tests,
# then Lighthouse CI on public routes. Vercel's GitHub integration creates the deployment status,
# and the Neon integration gives each preview its own database branch.
name: preview

on: deployment_status

jobs:
  smoke-and-lighthouse:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      # Vercel → Settings → Deployment Protection → Protection Bypass for Automation.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v7
      # pnpm first (version from package.json#packageManager), then Node with the pnpm cache.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the preview is reachable past Vercel Deployment Protection
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::GitHub secret VERCEL_AUTOMATION_BYPASS_SECRET is missing. Create it in Vercel (Settings → Deployment Protection → Protection Bypass for Automation) and add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          read -r status type < <(curl -s -o /tmp/health.json -w '%{http_code} %{content_type}\n' -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$BASE_URL/api/v1/health")
          case "$status $type" in
            "200 application/json"*) echo "Preview reachable"; cat /tmp/health.json;;
            401*|302*|307*) echo "::error::Vercel rejected the bypass secret (HTTP $status). Copy the value again from Vercel into the GitHub secret."; exit 1;;
            *) echo "::error::The preview app failed /api/v1/health with HTTP $status. Usually a missing Vercel env var for Preview (BETTER_AUTH_SECRET first). Check the deployment's Runtime Logs in Vercel."; head -c 500 /tmp/health.json; exit 1;;
          esac
      - run: pnpm --filter @tokslearn/web exec playwright install --with-deps chromium
      - name: Playwright smoke
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BASE_URL }}
        run: pnpm --filter @tokslearn/web exec playwright test --project=mobile --project=desktop
      - name: Lighthouse CI (mobile)
        env:
          LHCI_BASE_URL: ${{ env.BASE_URL }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: pnpm dlx @lhci/cli@0.15.1 autorun --config=apps/web/lighthouserc.cjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
