# Quality gates on every PR (docs/15 §4). Merge is blocked if any job fails.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tokslearn_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/tokslearn_test
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v7
      # pnpm first (version from package.json#packageManager), then Node with the pnpm cache.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, unit tests
        run: pnpm typecheck && pnpm lint && pnpm test
      - name: Copy check (banned words)
        run: pnpm copy:check
      - name: Contract builds standalone (mobile readiness, docs/17 §1.10)
        run: pnpm --filter @tokslearn/contract build
      - name: Migrations consistent
        run: pnpm --filter @tokslearn/db db:check
      - name: Integration tests (real Postgres)
        run: pnpm test:int
      - name: Reference data, as on deploy (categories for the static category pages)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/tokslearn_test
        run: pnpm db:seed:reference && pnpm db:reindex
      - name: Build web
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_ENV: preview
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/tokslearn_test
          APP_VERSION: ${{ github.sha }}
        run: pnpm turbo run build --filter=@tokslearn/web
      - name: First-load JS budget (docs/12 §1)
        run: node scripts/check-bundle-size.mjs
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
